# ===============================
# App
# ===============================
spring.application.name=servis-za-rsw
server.port=8090

# Keep SQL noise down (flip to true while debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.tool.schema=OFF

# Safer default: don't keep the session open across view rendering
spring.jpa.open-in-view=false

# ===============================
# MySQL
# Kredencijali se mogu zadati kroz env promenljive ili .env fajl (spring-dotenv),
# u suprotnom vaze podrazumevane vrednosti posle ':'
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/razvojsoftvera?useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:5fu43316DainLumi}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connectionInitSql=SET SESSION sql_require_primary_key=0
# create-drop brise bazu pri svakom gasenju; Seeder je ponovo puni pri startu
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}

# ===============================
# Bezbednost (JWT)
# U produkciji OBAVEZNO zadati JWT_SECRET (najmanje 32 karaktera), podrazumevani kljuc je samo za razvoj
# ===============================
app.security.jwt-secret=${JWT_SECRET:dev-tajni-kljuc-za-studsluzba-samo-lokalno-0123456789}
app.security.jwt-trajanje=${JWT_TRAJANJE:8h}
app.security.cors-origins=${CORS_ORIGINS:*}
# lozinka za naloge koje pravi Seeder (svi seedovani studenti i nastavnici)
app.seed.lozinka=${SEED_LOZINKA:lozinka123}

app.storage.root=./storage
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB